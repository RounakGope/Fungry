spring.application.name=fungry
server.port=${PORT:9080}

# Local-only secrets file (gitignored). If it exists, its values override the ones below.
spring.config.import=optional:classpath:application-secrets.properties

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fungry}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:fungry_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:fungry_pass}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

server.servlet.session.cookie.same-site=${COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=true

spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s

# Stripe: never commit real keys. Use env vars on Render, application-secrets.properties locally.
stripe.secret.key=${STRIPE_SECRET_KEY:}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}

order.expiry-minutes=${ORDER_EXPIRY_MINUTES:10}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}

management.endpoints.web.exposure.include=health