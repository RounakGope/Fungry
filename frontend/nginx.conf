server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API calls go to the backend container (docker-compose service "backend")
    location /api-v2.0/ {
        proxy_pass http://backend:9080/api-v2.0/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
